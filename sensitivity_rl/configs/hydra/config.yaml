# Entry point of the Hydra configuration: default method and environment.
hydra:
  job:
    chdir: False       # Stay in the launch directory (JAX cache paths are relative)
  run:
    dir: .
  output_subdir: null  # No .hydra folder
  
defaults:
  - method: ppo
  - env: tilthex_v1
  - override hydra/job_logging: none
  - override hydra/hydra_logging: none
  - _self_

# Values below override the method and environment files
SEED: 30

# Optional path to a saved policy_params.msgpack for actor warm-start
LOAD_ACTOR_PARAMS_PATH: null

# In-training deterministic evaluation loop
EVAL_ENABLED: true
EVAL_DURING_TRAINING_ENABLED: true
EVAL_EVERY_UPDATES: 5
