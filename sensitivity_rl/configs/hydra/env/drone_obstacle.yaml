# Configuration for Drone Obstacle environment (inherits drone_v3 defaults)
defaults:
  - drone_v3
  - _self_

# Override environment
ENV_NAME: drone_obstacle
NUM_STEPS: 200          # Steps collected per training update (used as episode length during training)
EVAL_MAX_STEPS_IN_EPISODE: 300  # Episode length used during rollout/testing

TOTAL_TIMESTEPS: 2e8

SENSITIVITY_REGULARIZATION_WEIGHT: 0.2


# Enable constraint penalty wrapper
CONSTRAINTS: true
CONSTRAINT_PENALTY: 100.0

ALGORITHM: ppo
