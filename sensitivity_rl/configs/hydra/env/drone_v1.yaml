# @package _global_
# Drone V1 environment configuration

ENV_NAME: drone_v1

# Environment-specific parameters
NUM_ENVS: 2048
NUM_STEPS: 200
TOTAL_TIMESTEPS: 10e7
NUM_MINIBATCHES: 128

# Override network architecture for drone
ACTIVATION: tanh
ANNEAL_LR: true
GRU_HIDDEN_SIZE: 64

# Override some RL parameters for drone
GAMMA: 0.98
GAE_LAMBDA: 0.95
CLIP_EPS: 0.2
SENSITIVITY_REGULARIZATION_WEIGHT: 0.0

# SAC-specific overrides for drone_v1
BUFFER_SIZE: 4e5
ENT_COEF: 0.0
