# @package _global_
# Drone V2 environment configuration

# Environment settings
ENV_NAME: drone_v2

# Environment-specific parameters
NUM_ENVS: 2048
NUM_STEPS: 200          # Steps collected per training update (used as episode length during training)
EVAL_MAX_STEPS_IN_EPISODE: 200  # Episode length used during rollout/testing
SENSITIVITY_NUM_STEPS: 50
TOTAL_TIMESTEPS: 5e7
NUM_MINIBATCHES: 128

# Override network architecture for drone
ACTIVATION: tanh
ANNEAL_LR: true
GRU_HIDDEN_SIZE: 64

# Override some RL parameters for drone
GAMMA: 0.98
CLIP_EPS: 0.2
ENT_COEF: 0.001

ACTOR_LAYER_SIZES: [256, 256]
CRITIC_LAYER_SIZES: [256, 256]

SENSITIVITY_REGULARIZATION_WEIGHT: 0.02
DOMAIN_RANDOMIZATION: false
