# @package _global_
# Quadrotor environment

# Environment settings
ENV_NAME: drone_v3

# Environment-specific parameters
NUM_ENVS: 2048
NUM_STEPS: 200          # Steps per update, also the training episode length
EVAL_MAX_STEPS_IN_EPISODE: 300  # Episode length of the rollouts
SENSITIVITY_NUM_STEPS: 50
TOTAL_TIMESTEPS: 5e7
NUM_MINIBATCHES: 128

# Network
ACTIVATION: tanh
ANNEAL_LR: true
GRU_HIDDEN_SIZE: 64

# RL parameters
GAMMA: 0.98
CLIP_EPS: 0.2
ENT_COEF: 0.001

ACTOR_LAYER_SIZES: [128, 128, 128]
CRITIC_LAYER_SIZES: [128, 128, 128]

SENSITIVITY_REGULARIZATION_WEIGHT: 0.1
DOMAIN_RANDOMIZATION: false

