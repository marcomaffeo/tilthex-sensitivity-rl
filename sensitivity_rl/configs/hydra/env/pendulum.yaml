# @package _global_
# Pendulum swing-up: a small example to check an installation and to show how an
# environment is plugged into the framework. It trains in a few minutes on a laptop CPU.

ENV_NAME: pendulum

# Environment settings
NUM_ENVS: 256
NUM_STEPS: 200          # one full episode per update
TOTAL_TIMESTEPS: 5000000
NUM_MINIBATCHES: 32

# RL parameters
UPDATE_EPOCHS: 10
GAMMA: 0.95
ENT_COEF: 0.0

# Sensitivity
SENSITIVITY_REGULARIZATION_WEIGHT: 0.02
DOMAIN_RANDOMIZATION: false
