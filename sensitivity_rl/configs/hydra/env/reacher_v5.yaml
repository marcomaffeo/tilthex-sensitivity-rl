# @package _global_
# HalfCheetah V5 environment configuration

ENV_NAME: reacher_v5

# Environment-specific parameters
NUM_ENVS: 1000
NUM_STEPS: 50
TOTAL_TIMESTEPS: 5e6
NUM_MINIBATCHES: 20

# Override network architecture for drone
ACTIVATION: relu
ANNEAL_LR: true
GRU_HIDDEN_SIZE: 64

# Override some RL parameters for drone
GAMMA: 0.99
CLIP_EPS: 0.2
ENT_COEF: 0.001

ACTOR_LAYER_SIZES: [128, 128]
CRITIC_LAYER_SIZES: [128, 128]

SENSITIVITY_REGULARIZATION_WEIGHT: 0.5

# SAC-specific overrides for drone_v1
BUFFER_SIZE: 1e6