# @package _global_
# Tilthex environment (the one of the thesis)

ENV_NAME: "tilthex_v1"

# Environment settings
NUM_ENVS: 2048
NUM_STEPS: 200
TOTAL_TIMESTEPS: 50000000

ACTIVATION: "tanh"
ANNEAL_LR: true
GRU_HIDDEN_SIZE: 64

# RL parameters
SEED: 14
LR: 0.001
UPDATE_EPOCHS: 5
NUM_MINIBATCHES: 128
GAMMA: 0.98
GAE_LAMBDA: 0.95
CLIP_EPS: 0.1
ENT_COEF: 0.001
VF_COEF: 0.5
MAX_GRAD_NORM: 0.5
DOMAIN_RANDOMIZATION: false
SENSITIVITY_REGULARIZATION_WEIGHT: 0.01

# Reward shaping
GAIN_STAB: 0.2
GAIN_ATT: 2.0
GAIN_SM: 1.0
GAIN_REF: 1.0
REWARD_POS_TOLERANCE: 0.04