# @package _global_
# PPO and SPPO (ALGORITHM selects the variant)

ALGORITHM: sppo_aug_grad_param_dual
# Learning parameters
LR: 0.001
UPDATE_EPOCHS: 4
NUM_MINIBATCHES: 25

# RL Algorithm parameters
GAMMA: 0.99
NUM_ENVS: 50
GAE_LAMBDA: 0.95
CLIP_EPS: 0.1
ENT_COEF: 0.0
VF_COEF: 0.5
MAX_GRAD_NORM: 0.5
POLICY_MAX_GRAD_NORM: 0.5
DOMAIN_RANDOMIZATION: false

# Network architecture
ACTIVATION: tanh
ACTOR_LAYER_SIZES: [256, 256]
CRITIC_LAYER_SIZES: [256, 256]

# Training settings
ANNEAL_LR: false
NORMALIZE_ENV: true
DEBUG: true

# Sensitivity settings
SENSITIVITY: true
SENSITIVITY_REGULARIZATION_WEIGHT: 0.02
XI: 0.08
RHO: 0.0
TAU: 0.00001

# GRU settings (sensitivity critic)
GRU_HIDDEN_SIZE: 128
