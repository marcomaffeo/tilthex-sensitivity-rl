# SAC method configuration
# @package _global_

# Learning parameters
POLICY_LR: 3e-4
Q_LR: 1e-3
ALPHA_LR: 1e-4

# SAC-specific parameters
BUFFER_SIZE: 1e6
SENSITIVITY_BUFFER_SIZE: 5e4
NUM_ENVS: 1
BATCH_SIZE: 256
LEARNING_STARTS: 5000
POLICY_FREQUENCY: 50
TARGET_NETWORK_FREQUENCY: 1
UPDATE_EPOCHS: 1

# RL Algorithm parameters
GAMMA: 0.99
ENT_COEF: "auto"
MAX_GRAD_NORM: 0.5
POLYAK_TAU: 0.005
CLIP_EPS: 0.1

# Network architecture
ACTIVATION: relu
ACTOR_LAYER_SIZES: [128, 128]
CRITIC_LAYER_SIZES: [128, 128]

# Training settings
ANNEAL_LR: false
NORMALIZE_ENV: false
DEBUG: true


# Sensitivity settings
SENSITIVITY: true
SENSITIVITY_REGULARIZATION_WEIGHT: 0.1
TARGET_SENSITIVITY: 180.0
EVAL_SENSITIVITY_FREQUENCY: 10000
