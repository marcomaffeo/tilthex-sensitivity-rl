# Example configuration for testing with reduced resources
defaults:
  - config

# Smaller settings for quick testing
TOTAL_TIMESTEPS: 1e6  # 1M instead of 10M
NUM_ENVS: 25  # Half of default
NUM_STEPS: 500  # Half of default

# Test different sensitivity weights
SENSITIVITY_REGULARIZATION_WEIGHT: 0.5

# Different seed for testing
SEED: 42
