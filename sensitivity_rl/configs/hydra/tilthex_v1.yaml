# Configuration for Tilthex V1 environment
defaults:
  - config

# Environment settings
ENV_NAME: tilthex_v1

# Environment-specific parameters
NUM_ENVS: 2048
NUM_STEPS: 200
TOTAL_TIMESTEPS: 5e7
NUM_MINIBATCHES: 128

# Override network architecture for drone
ACTIVATION: tanh
ANNEAL_LR: true
GRU_HIDDEN_SIZE: 64

# Override some RL parameters for drone
GAMMA: 0.98
CLIP_EPS: 0.1
ENT_COEF: 0.001
ACTOR_LAYER_SIZES: [256, 256]
CRITIC_LAYER_SIZES: [256, 256]
SEED: 24
DOMAIN_RANDOMIZATION: false
UPDATE_EPOCHS: 5
LR: 0.001

SENSITIVITY_REGULARIZATION_WEIGHT: 0.1
