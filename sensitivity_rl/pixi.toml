# pixi.toml - Pixi environment and task configuration for sensitivity_rl

[project]
name = "sensitivity-rl"
description = "PPO in JAX with parametric sensitivity optimization."
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[dependencies]
python = ">=3.10,<3.15"
tensorboard = "*"
numpy = "*"
matplotlib = "*"
python-build = "*"
pip = "*"
pytest = ">=8.4.2,<9"


[pypi-dependencies]
jax = ">=0.6.0, <=0.7.2"
distrax = "*"
torch = ">=2.0.0"
gymnax = "*"
flax = "*"
optax = "*"
chex = "*"
#sensitivity-rl = { path = ".", editable = true }

# CPU environment: install JAX CPU wheels via PyPI
# [feature.cpu.pypi-dependencies]
# jax = { version = ">=0.6.0, <=0.7.2"}

# CUDA 12 environment: install JAX CUDA 12 wheels via PyPI
[feature.cuda12]
platforms = ["linux-64"]
[feature.cuda12.pypi-dependencies]
jax = { version = ">=0.6.0, <=0.7.2", extras = ["cuda12"] }

# JAX variant install options
# CPU-only JAX wheel (works on Linux/macOS CPU)
# Named environments to choose CPU or CUDA variant via: pixi -e <env>
[environments]
# default = { features = ["cpu"], solve-group = "default" }
cuda = { features = ["cuda12"], solve-group = "default" }


[tasks]
# Train PPO and write latest artifacts into runs/latest
train = "python sensitivity_rl/ppo.py"

# Generate evaluation rollouts from a trained policy. Example:
#   pixi run rollouts --run_dirs runs/latest --num_rollouts 100 --batch_size 256 --deterministic
rollouts = "python sensitivity_rl/rollouts.py"

plot_drone = "python sensitivity_rl/plots/plot_drone_rollouts.py"

# Quick Jacobian/sensitivity checks
test-sensitivity = "python sensitivity_rl/test_sensitivity.py"

# Deletes all results
clean = "rm -r ./runs/*"

# Build wheel/sdist into dist/
build = "python -m build"
# Install in editable mode
install = "pip install -e ."
