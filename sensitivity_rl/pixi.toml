# Environment and tasks of the training framework

[workspace]
name = "sensitivity-rl"
description = "PPO in JAX with parametric sensitivity optimization."
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[dependencies]
# Python >= 3.11 is required by flax >= 0.12 (nnx.List)
python = ">=3.11,<3.13"
tensorboard = "*"
numpy = "*"
matplotlib = ">=3.10.9,<4"
python-build = "*"
pip = "*"
pytest = ">=8.4.2,<9"
imageio = ">=2.37.0,<3"
setuptools = "<70"
# hydra-core comes from conda-forge: its PyPI dependency antlr4-python3-runtime 4.9.3
# is source-only and cannot be built for the Linux cuda environment on macOS.
hydra-core = "*"


[pypi-dependencies]
jax = "<=0.9.1"
# distrax >= 0.1.8 uses tfp-nightly, which works with jax 0.9
distrax = ">=0.1.8"
torch = ">=2.0.0"
gymnax = "*"
flax = ">=0.12"
optax = "*"
chex = "*"

# CUDA 12 environment (Linux): pixi run -e cuda ...
[feature.cuda12]
platforms = ["linux-64"]
[feature.cuda12.pypi-dependencies]
jax = { version = "<=0.9.1", extras = ["cuda12"] }

[environments]
cuda = { features = ["cuda12"], solve-group = "default" }


[tasks]
# Training, with Hydra overrides: pixi run train ALGORITHM=ppo env=tilthex_v1
train = "python sensitivity_rl/train.py"
train_ppo = "python sensitivity_rl/train.py ALGORITHM=ppo"
train_sppo = "python sensitivity_rl/train.py ALGORITHM=sppo_aug_grad_param_dual"

# Evaluation rollouts of a trained policy:
#   pixi run rollouts --run_dirs runs/latest --num_rollouts 100 --param_samples 10 --plot
rollouts = "python sensitivity_rl/rollouts.py"

# Delete all training runs
clean = "rm -r ./runs/*"

[target.linux-64.dependencies]
texlive-core = ">=20230313,<20230314"
