# pixi.toml - Pixi environment and task configuration for sensitivity_rl

[workspace]
name = "sensitivity-rl"
description = "PPO in JAX with parametric sensitivity optimization."
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[dependencies]
# Python >= 3.11 is required by flax >= 0.12 (nnx.List)
python = ">=3.11,<3.13"
tensorboard = "*"
numpy = "*"
matplotlib = ">=3.10.9,<4"
python-build = "*"
pip = "*"
pytest = ">=8.4.2,<9"
imageio = ">=2.37.0,<3"
setuptools = "<70"
# hydra-core from conda-forge: on PyPI its dependency antlr4-python3-runtime 4.9.3 is
# source-only, and pixi cannot build it for the linux-only cuda environment on macOS.
hydra-core = "*"


[pypi-dependencies]
jax = "<=0.9.1"
# distrax >= 0.1.8 uses tfp-nightly; 0.1.5 pulls tensorflow-probability 0.25, incompatible with jax 0.9
distrax = ">=0.1.8"
torch = ">=2.0.0"
gymnax = "*"
flax = ">=0.12"
optax = "*"
chex = "*"
#sensitivity-rl = { path = ".", editable = true }

# CPU environment: install JAX CPU wheels via PyPI
# [feature.cpu.pypi-dependencies]
# jax = { version = ">=0.6.0, <=0.7.2"}

# CUDA 12 environment: install JAX CUDA 12 wheels via PyPI
[feature.cuda12]
platforms = ["linux-64"]
[feature.cuda12.pypi-dependencies]
jax = { version = "<=0.9.1", extras = ["cuda12"] }

# JAX variant install options
# CPU-only JAX wheel (works on Linux/macOS CPU)
# Named environments to choose CPU or CUDA variant via: pixi -e <env>
[environments]
# default = { features = ["cpu"], solve-group = "default" }
cuda = { features = ["cuda12"], solve-group = "default" }


[tasks]
# Unified training entry point
# Usage (Hydra overrides): pixi run train ALGORITHM=ppo env=tilthex_v1
#                         pixi run train ALGORITHM=sppo env=drone_v3
train = "python sensitivity_rl/train.py"

# Convenience aliases for common algorithms
train_ppo = "python sensitivity_rl/train.py ALGORITHM=ppo"
train_sppo = "python sensitivity_rl/train.py ALGORITHM=sppo"
train_sppo_dual = "python sensitivity_rl/train.py ALGORITHM=sppo_aug"
train_sppo_grad = "python sensitivity_rl/train.py ALGORITHM=sppo_grad"
train_sppo_grad_param = "python sensitivity_rl/train.py ALGORITHM=sppo_grad_param"
train_sppo_aug_grad_param_dual = "python sensitivity_rl/train.py ALGORITHM=sppo_aug_grad_param_dual"

# Generate evaluation rollouts from a trained policy. Example:
#   pixi run rollouts --run_dirs runs/latest --num_rollouts 100 --batch_size 256 --deterministic
rollouts = "python sensitivity_rl/rollouts.py"

plot_svg = "python sensitivity_rl/plots/plot_svg.py --data runs/latest/rollout_data_nominal.npz --outdir runs/latest/svg_plots/nominal && python sensitivity_rl/plots/plot_svg.py --data runs/latest/rollout_data_perturbed.npz --outdir runs/latest/svg_plots/perturbed"


# Deletes all results
clean = "rm -r ./runs/*"

# Build wheel/sdist into dist/
build = "python -m build"
# Install in editable mode
install = "pip install -e ."

[target.linux-64.dependencies]
texlive-core = ">=20230313,<20230314"
