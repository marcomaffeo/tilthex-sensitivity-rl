[workspace]
authors = ["Tommaso Belvedere <tommaso.belvedere@irisa.fr>", "Olivier Roussel <olivier.roussel@inria.fr"]
channels = ["conda-forge", "robostack-jazzy"]
name = "telekyb_sim"
platforms = ["linux-64"]
version = "0.1.0"

[activation]
scripts = ["development/scripts/pixi/activation.sh"]

[tasks]
checkout = { cmd = "sh ./development/scripts/pixi/checkout_telekyb3.sh" }
build = { cmd = "sh ./development/scripts/pixi/build_telekyb3.sh" }
components = { cmd = "sh ./scripts/components.sh" }
web-gui = { cmd = "sh ./scripts/websocket.sh" }
quadrotor-control = {cmd = "python -i src/tk3-quadrotor-control.py"}
tilthex-control = {cmd = "python -i src/tk3-tilthex-control.py"}
policy-control = {cmd = "python src/policy_control_node.py"}
policy-control-tilthex = {cmd = "python src/policy_control_node_tilthex.py"}

# Policy management tasks
policy-setup = { cmd = "ros2 service call /control/setup std_srvs/srv/Trigger" }
policy-start = { cmd = "ros2 service call /control/start std_srvs/srv/Trigger" }
policy-takeoff = { cmd = "ros2 service call /control/takeoff std_srvs/srv/Trigger" }
policy-loop-start = { cmd = "ros2 service call /policy/start std_srvs/srv/Trigger" }
policy-loop-stop = { cmd = "ros2 service call /policy/stop std_srvs/srv/Trigger" }
policy-land = { cmd = "ros2 service call /policy/land std_srvs/srv/Trigger" }
policy-stop = { cmd = "ros2 service call /control/stop std_srvs/srv/Trigger" }

[tasks.policy-setpoint]
args = [
  { "arg" = "x", "default" = "0.0" },
  { "arg" = "y", "default" = "0.0" },
  { "arg" = "z", "default" = "1.0" },
  { "arg" = "yaw", "default" = "0.0" },
]
cmd = "ros2 topic pub -1 /policy/setpoint geometry_msgs/msg/PoseStamped \"{ header: {frame_id: 'world'}, pose: {position: {x: {{ x }}, y: {{ y }}, z: {{ z }}}, orientation: {w: 1.0, x: 0.0, y: 0.0, z: 0.0}} }\""

[tasks.sim]
args = [
  { "arg" = "world_file", "default" = "worlds/example.world" },
]
cmd = "gz sim -v 4 -r {{ world_file }}"

[tasks.sim-server]
args = [
  { "arg" = "world_file", "default" = "worlds/example.world" },
]
cmd = "gz sim -v 4 -r -s {{ world_file }}"

[tasks.sim-remote]
args = [
  { "arg" = "world_file", "default" = "worlds/example.world" },
]
cmd = "sh ./scripts/websocket.sh & gz sim -v 4 -r -s {{ world_file }}"

[tasks.sim-reset]
args = [
  { "arg" = "world_name", "default" = "mrsim" },
]
cmd = "gz service -s /world/{{ world_name }}/control --reqtype gz.msgs.WorldControl --reptype gz.msgs.Boolean --timeout 3000 --req 'reset: {all: true}'"

[dependencies]
c-compiler = "*"
cxx-compiler = "*"
autoconf = "*"
automake = "*"
libtool = "*"
make = "*"
pkg-config = "*"
git = ">=2.47.0"
flex = "*"
bison = "*"
tcllib = "*" # genom3
libtirpc = "*" # pocolibs
eigen = "*" # rotorcraft
libudev = "*"
asciidoctor = "*"
proxsuite = "*"
gz-sim = "<10"
libgz-launch = ">=8,<9"
gz-plugin = ">=4.0.0,<5"
# dependencies for python use only
loop-rate-limiters = "*"
pyyaml = ">=6.0.2"
matplotlib = ">=3.10.5"
bokeh = "*"
jax = ">=0.7.2,<0.8"
flax = ">=0.10.4,<0.11"
distrax = ">=0.1.7,<0.2"
# ROS2 Jazzy dependencies
ros-jazzy-ros-core = "*"
ros-jazzy-geometry-msgs = "*"
ros-jazzy-sensor-msgs = "*"
ros-jazzy-nav-msgs = "*"
ros-jazzy-std-srvs = "*"
colcon-common-extensions = "*"
