[workspace]
authors = ["Tommaso Belvedere <tommaso.belvedere@irisa.fr>", "Olivier Roussel <olivier.roussel@inria.fr"]
channels = ["conda-forge", "robostack-jazzy"]
name = "telekyb_sim"
platforms = ["linux-64", "linux-aarch64"]
version = "0.1.0"

[activation]
scripts = ["development/scripts/pixi/activation.sh"]

[tasks]
checkout = { cmd = "sh ./development/scripts/pixi/checkout_telekyb3.sh" }
build = { cmd = "sh ./development/scripts/pixi/build_telekyb3.sh" }
components = { cmd = "sh ./scripts/components.sh" }
web-gui = { cmd = "sh ./scripts/websocket.sh" }
tilthex-control = {cmd = "python -i src/tk3-tilthex-control.py"}
policy-control-tilthex = {cmd = "python src/policy_control_node_tilthex.py"}
policy-control-tilthex-pytorch = {cmd = "python src/policy_control_node_tilthex_pytorch.py"}
plot-svg = { cmd = "python src/plot.py" }
policy-battery = { cmd = "python src/policy_control_node_tilthex.py --battery" }
policy-telemetry = { cmd = "python src/policy_control_node_tilthex.py --telemetry" }

# Policy management tasks
policy-setup = { cmd = "ros2 service call /control/setup std_srvs/srv/Trigger" }
policy-start = { cmd = "ros2 service call /control/start std_srvs/srv/Trigger" }
policy-takeoff = { cmd = "ros2 service call /control/takeoff std_srvs/srv/Trigger" }
policy-loop-start = { cmd = "ros2 service call /policy/start std_srvs/srv/Trigger" }
policy-loop-takeoff = { cmd = "ros2 service call /policy/takeoff std_srvs/srv/Trigger" }
policy-loop-land = { cmd = "ros2 service call /policy/land std_srvs/srv/Trigger" }
policy-loop-stop = { cmd = "ros2 service call /policy/stop std_srvs/srv/Trigger" }
policy-pid-start = { cmd = "ros2 service call /policy/pid_start std_srvs/srv/Trigger" }
policy-pid-stop = { cmd = "ros2 service call /policy/pid_stop std_srvs/srv/Trigger" }
policy-go = { cmd = "ros2 service call /policy/pid_go std_srvs/srv/Trigger" }
policy-pid-test = { cmd = "ros2 service call /control/pid_test std_srvs/srv/Trigger" }
policy-land = { cmd = "ros2 service call /control/land std_srvs/srv/Trigger" }
policy-stop = { cmd = "ros2 service call /control/stop std_srvs/srv/Trigger" }

[tasks.policy-setpoint]
args = [
  { "arg" = "x", "default" = "0.0" },
  { "arg" = "y", "default" = "0.0" },
  { "arg" = "z", "default" = "1.0" },
  { "arg" = "roll", "default" = "0.0" },
  { "arg" = "pitch", "default" = "0.0" },
  { "arg" = "yaw", "default" = "0.0" },
]
cmd = "python src/policy_control_node_tilthex.py --setpoint {{ x }} {{ y }} {{ z }} {{ roll }} {{ pitch }} {{ yaw }}"

[tasks.policy-setattitude]
args = [
  { "arg" = "roll", "default" = "0.0" },
  { "arg" = "pitch", "default" = "0.0" },
  { "arg" = "yaw", "default" = "0.0" },
]
cmd = "python src/policy_control_node_tilthex.py --setattitude {{ roll }} {{ pitch }} {{ yaw }}"

[tasks.policy-mission]
args = [
  { "arg" = "x", "default" = "0.1" },
  { "arg" = "y", "default" = "0.0" },
  { "arg" = "z", "default" = "0.0" },
  { "arg" = "roll", "default" = "0.0" },
  { "arg" = "pitch", "default" = "0.0" },
  { "arg" = "yaw", "default" = "0.0" },
  { "arg" = "wait1", "default" = "10.0" },
  { "arg" = "wait2", "default" = "10.0" },
  { "arg" = "wait3", "default" = "5.0" },
]
cmd = "python src/policy_control_node_tilthex.py --mission {{ x }} {{ y }} {{ z }} {{ roll }} {{ pitch }} {{ yaw }} {{ wait1 }} {{ wait2 }} {{ wait3 }}"

[tasks.policy-takeoff-to-point-land]
args = [
  { "arg" = "takeoff", "default" = "0.8" },
  { "arg" = "x", "default" = "0.1" },
  { "arg" = "y", "default" = "0.0" },
  { "arg" = "z", "default" = "0.0" },
  { "arg" = "wait", "default" = "6.0" },
]
cmd = "python src/policy_control_node_tilthex.py --takeoff-to-point-land {{ takeoff }} {{ x }} {{ y }} {{ z }} {{ wait }}"

[tasks.policy-takeoff-zero-point-land]
args = [
  { "arg" = "takeoff", "default" = "0.8" },
  { "arg" = "x", "default" = "0.1" },
  { "arg" = "y", "default" = "0.0" },
  { "arg" = "z", "default" = "0.0" },
  { "arg" = "wait", "default" = "6.0" },
]
cmd = "python src/policy_control_node_tilthex.py --takeoff-zero-point-land {{ takeoff }} {{ x }} {{ y }} {{ z }} {{ wait }}"

[tasks.policy-takeoff-zero-attitude-zero-land]
args = [
  { "arg" = "takeoff", "default" = "0.8" },
  { "arg" = "roll", "default" = "0.0" },
  { "arg" = "pitch", "default" = "0.0" },
  { "arg" = "yaw", "default" = "0.0" },
  { "arg" = "wait", "default" = "6.0" },
]
cmd = "python src/policy_control_node_tilthex.py --takeoff-zero-attitude-zero-land {{ takeoff }} {{ roll }} {{ pitch }} {{ yaw }} {{ wait }}"

[tasks.policy-takeoff-attitude-land]
args = [
  { "arg" = "takeoff", "default" = "0.8" },
  { "arg" = "roll", "default" = "0.0" },
  { "arg" = "pitch", "default" = "0.0" },
  { "arg" = "yaw", "default" = "0.0" },
  { "arg" = "wait", "default" = "6.0" },
]
cmd = "python src/policy_control_node_tilthex.py --takeoff-attitude-land {{ takeoff }} {{ roll }} {{ pitch }} {{ yaw }} {{ wait }}"

[tasks.sim]
args = [
  { "arg" = "world_file", "default" = "worlds/myworld.world" },
]
cmd = "gz sim -v 4 -r {{ world_file }}"

[tasks.sim-server]
args = [
  { "arg" = "world_file", "default" = "worlds/myworld.world" },
]
cmd = "gz sim -v 4 -r -s {{ world_file }}"

[tasks.sim-remote]
args = [
  { "arg" = "world_file", "default" = "worlds/myworld.world" },
]
cmd = "sh ./scripts/websocket.sh & gz sim -v 4 -r -s {{ world_file }}"

[tasks.sim-reset]
args = [
  { "arg" = "world_name", "default" = "mrsim" },
]
cmd = "gz service -s /world/{{ world_name }}/control --reqtype gz.msgs.WorldControl --reptype gz.msgs.Boolean --timeout 3000 --req 'reset: {all: true}'"

[dependencies]
c-compiler = "*"
cxx-compiler = "*"
autoconf = "*"
automake = "*"
libtool = "*"
make = "*"
pkg-config = "*"
git = ">=2.47.0"
flex = "*"
bison = "*"
tcllib = "*" # genom3
libtirpc = "*" # pocolibs
eigen = "*" # rotorcraft
libudev = "*"
asciidoctor = "*"
proxsuite = "*"
loop-rate-limiters = "*"
pyyaml = ">=6.0.2"
matplotlib = ">=3.10.5"
bokeh = "*"
ros-jazzy-ros-core = "*"
ros-jazzy-geometry-msgs = "*"
ros-jazzy-sensor-msgs = "*"
ros-jazzy-nav-msgs = "*"
ros-jazzy-std-srvs = "*"
colcon-common-extensions = "*"

[pypi-dependencies]
flax = ">=0.12.6"
distrax = "*"
torch = "*"

[target.linux-64.dependencies]
gz-sim = "<10"
libgz-launch = ">=8,<9"
gz-plugin = ">=4.0.0,<5"

[target.linux-64.pypi-dependencies]
jax = { version = "*", extras = ["cuda12"] }

[target.linux-aarch64.pypi-dependencies]
jax = { version = "*" }
